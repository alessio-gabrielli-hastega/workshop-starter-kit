<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Il Mio Catalogo (Lezione 5)</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: auto; }
        .film { background: #eee; padding: 10px; margin-bottom: 10px; border-radius: 5px; }
        button { padding: 10px; background: #e50914; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Catalogo Film 🎬</h1>
    <button id="carica">Richiedi Dati all'API</button>
    <div id="lista-film" style="margin-top: 20px;"></div>

    <script>
        document.getElementById('carica').addEventListener('click', async () => {
            const divRisultati = document.getElementById('lista-film');
            divRisultati.innerHTML = "Caricamento...";
            
            // Chiama il server scritto in Node.js
            const risposta = await fetch('/api/film');
            const dati = await risposta.json();
            
            divRisultati.innerHTML = "";
            dati.forEach(film => {
                divRisultati.innerHTML += `
                    <div class="film">
                        <strong>${film.titolo}</strong> (${film.anno}) - <em>${film.genere}</em>
                    </div>
                `;
            });
        });
    </script>
</body>
</html>
